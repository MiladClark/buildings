services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vahedban
      POSTGRES_USER: vahedban
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-local:/var/lib/postgresql/data
volumes:
  postgres-local:
