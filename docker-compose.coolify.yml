services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    expose:
      - "3300"
    environment:
      # Coolify also parses this file during builds, without runtime secrets.
      # Missing values fail closed in PostgreSQL init or the app entrypoint.
      DATABASE_URL: postgresql://vahedban:${POSTGRES_PASSWORD:-}@postgres:5432/vahedban
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://vahedban.ir}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      CHAT_UPLOAD_DIR: /app/data/chat-uploads
      INITIAL_IMPORT_BUNDLE: ${INITIAL_IMPORT_BUNDLE:-}
    volumes:
      - uploads:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vahedban
      POSTGRES_USER: vahedban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vahedban -d vahedban"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    stop_grace_period: 60s

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: vahedban
      PGUSER: vahedban
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-backups:/backups
      - uploads:/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'test -n "$$(find /backups -name last-success -mmin -1500 -print)"',
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  postgres-data:
  uploads:
  postgres-backups:
